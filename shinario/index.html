<script type="module">
    // 1. いただいたFirebase基本機能のインポート
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-analytics.js";

    // 2. ★追加：TRPGのリアルタイム通信ギミックに必要なDatabase機能のインポート
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

    // いただいたFirebase設定
    const firebaseConfig = {
        apiKey: "AIzaSyA778ia-qlR6i8RphVxzqrZWm7UNIFly5I",
        authDomain: "shinario-sns.firebaseapp.com",
        projectId: "shinario-sns",
        storageBucket: "shinario-sns.firebasestorage.app",
        messagingSenderId: "878950929651",
        appId: "1:878950929651:web:63883518f923393c725386",
        measurementId: "G-1N133S0WZR"
    };

    // Firebaseの初期化
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app); // データベースの初期化

    // ========================================================
    // ⚙️ 既存のシステム変数
    // ========================================================
    let currentScenario = "ch1";
    let hasCopiedSecret = false;
    let timerDuration = 600000;

    // ========================================================
    // 📱 アプリUI操作関数（HTMLから呼べるように window. に紐付け）
    // ========================================================

    window.switchApp = function (appName) {
        if (document.getElementById("secretBlackArea").style.display === "block" && appName !== 'blog') {
            alert("画面がハッキングされており、ホームに戻れません。");
            return;
        }
        document.querySelectorAll('.app-page').forEach(page => page.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

        if (appName === 'blog') {
            document.getElementById('page-blog').classList.add('active');
            document.querySelector('.nav-item:nth-child(1)').classList.add('active');
        } else if (appName === 'mail') {
            document.getElementById('page-mail').classList.add('active');
            document.querySelector('.nav-item:nth-child(2)').classList.add('active');
            document.getElementById("mailBadge").style.display = "none";
        }
    };

    window.goToLockScreen = function () {
        document.getElementById("normalBlogArea").style.display = "none";
        document.getElementById("lockScreenArea").style.display = "block";
        document.getElementById("passError").style.display = "none";
    };

    window.goBackToNormal = function () {
        document.getElementById("lockScreenArea").style.display = "none";
        document.getElementById("normalBlogArea").style.display = "block";
    };

    window.unlockArticle = function () {
        let pass = document.getElementById("articlePass").value;
        if (pass === "1284") {
            document.getElementById("lockScreenArea").style.display = "none";
            document.getElementById("secretBlackArea").style.display = "block";

            if (currentScenario === "ch1") {
                document.getElementById("secretRedMessage").innerHTML = "大人たちには秘密の場所へ<br>さあ、目を開いて真実を見つけて。";
                document.getElementById("secretHiddenText").innerHTML = `【PIPERからの招待状】<br>〇〇川の下流、〇〇の丘の裏にある「廃貯水庫」。<br>本日 25:00（午前1:00）開演。<br><br>演奏会に選ばれた 130人のお客様、<br>皆様お揃いになるのを、心よりお待ちしております。<br>──おいで、おいで。大人のいない、僕らの世界へ。`;
            } else {
                document.getElementById("secretRedMessage").innerHTML = "<span style='font-size:26px;'>オカアサンダヨ。アケテオクレ</span>";
                document.getElementById("secretHiddenText").innerHTML = `【WOLFの捕食命令：対象（子山羊）の洗脳シーケンス】<br>作戦時刻 25:15 ターゲットに内側から電子ロックを解除させ、侵入を開始せよ。<br>周波数・音響データの偽装率を上げ、完璧な母親の声を構築中。<br>人間どもを1匹残らず捕食（ころす）コードを実行します。`;
            }
        } else {
            document.getElementById("passError").style.display = "block";
        }
    };

    window.goBackToLockScreen = function () {
        document.getElementById("secretBlackArea").style.display = "none";
        document.getElementById("lockScreenArea").style.display = "block";
        document.getElementById("articlePass").value = "";
    };

    // ヘンダーソン社のメール受信演出
    window.openHendersonMail = function () {
        alert(
            "[SENDER: H.L.D. SPECIAL-LOG]\n" +
            "--------------------------------------------------\n" +
            "[PROTOCOL] 感情操作シーケンス：EXECUTE準備完了\n\n" +
            "対象個体の感情ログより『生存本能（恐怖）』のデリートパッチを確認。\n" +
            "代替プロトコルとして、当該精神状態に『秩序・善悪』を付与します。\n\n" +
            "警告：突入と同時に精神汚染防壁（メンタル・ファイアウォール）の更新を行います。\n" +
            "くれぐれも、ご留意いただきたい。"
        );
    };

    // ========================================================
    // 🌟 自動タイマー ＆ Firebaseの遠隔ハッキング準備
    // ========================================================

    // コピペ検知（今まで通りのローカルタイマー機能）
    document.getElementById("secretHiddenText").addEventListener('copy', triggerCh1Timer);
    document.getElementById("secretHiddenText").addEventListener('cut', triggerCh1Timer);

    function triggerCh1Timer() {
        if (hasCopiedSecret) return;
        hasCopiedSecret = true;
        console.log("コピペを検知。タイマーを開始します。");

        setTimeout(() => {
            document.getElementById("hendersonMail").style.display = "block";
            document.getElementById("mailBadge").style.display = "inline-block";
        }, timerDuration);
    }

    /* * 【実装予定】Firebase Realtime Database のリスナー
     * KPが自分の管理画面からデータベースの値を変更した瞬間、
     * PLの画面でこの中の処理が自動的に走るようになります。
     */
    const triggerRef = ref(db, 'session/hld_email_trigger');
    onValue(triggerRef, (snapshot) => {
        const data = snapshot.val();
        // もしKPがデータベースの値を "ON" にしたら、タイマーを待たずに強制受信させる
        if (data === "ON") {
            document.getElementById("hendersonMail").style.display = "block";
            document.getElementById("mailBadge").style.display = "inline-block";
            console.log("KPからのFirebaseリアルタイム通信を受信！メールを強制表示しました。");
        }
    });

</script>
