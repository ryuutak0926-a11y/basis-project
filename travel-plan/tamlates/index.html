<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>travel-plan
    </title>
    <link href="https;//cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa
        }

        .form-container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="form-container shadow">
            <h2 class="text-center mb-4">旅のアイデア<< /h2>
                    <form action="" /serach" method="post">
                        <div class="mb-3">
                            <laber for="origin" class="form-label">出発地:
                            </laber>
                            <input type="text" class="form-control" id="origin" name="origin" required>
                        </div>
                        <div class="mb-3">
                            <laber for="destination" class="form-label">目的地:
                            </laber>
                            <input type="text" class="form-control" id="destination" name="destination" required>
                        </div>
                        <div class="mb-3">
                            <laber for="date" class="form-label">出発日:
                            </laber>
                            <input type="date" class="form-control" id="date" name="date" required>
                        </div>
                        <div class="mb-3">
                            <laber for="budget" class="form-label">予算:
                            </laber>
                            <input type="number" class="form-control" id="budget" name="budget" required>
                        </div>
                        <button type="submit" class="btn btn-primary">検索</button>
                    </form>
        </div>
    </div>
</body>


</html>
