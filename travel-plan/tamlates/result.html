<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行計画アプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .form-container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="form-container shadow">
            <h2 class="text-center mb-4">旅のアイデア・デリバリー</h2>
            <form action="/search" method="post">
                <div class="mb-3">
                    <label for="origin" class="form-label">出発地（現地）</label>
                    <input type="text" class="form-control" id="origin" name="origin" placeholder="例：名古屋駅" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="budget" class="form-label">1人あたりの予算</label>
                        <input type="number" class="form-control" id="budget" name="budget" placeholder="例：30000"
                            required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="stay" class="form-label">可処分時間（宿泊数）</label>
                        <select class="form-control" id="stay" name="stay">
                            <option value="0">日帰り</option>
                            <option value="1">1泊</option>
                            <option value="2">2泊</option>
                            <option value="3">3泊以上</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">主な交通手段</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="transport" id="car" value="car" checked>
                        <label class="form-check-label" for="car">車</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="transport" id="train" value="train">
                        <label class="form-check-label" for="train">電車・公共交通</label>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label d-block">今の気分は？</label>
                    <select class="form-select" id="mood" name="mood">
                        <option value="relax">リラックス（温泉・自然）</option>
                        <option value="active">アクティブ（体験・冒険）</option>
                        <option value="gourmet">グルメ（郷土料理・市場）</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">旅先をデリバリーする！</button>
            </form>
        </div>
    </div>
</body>

</html>
